name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GATEWAY_BACKEND: mock
      AUTOBIOGRAPHY_LLM_PROVIDER: solar
      DEEPEVAL_TELEMETRY_OPT_OUT: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements/dev.txt
      - run: pip check
      - run: python -m pytest tests -q
  frontend:
    runs-on: ubuntu-latest
    env:
      GATEWAY_BACKEND: mock
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/production.txt
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r backend/requirements/production.txt
      - run: python -m scripts.export_openapi
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run generate:types
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/generated
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: frontend
